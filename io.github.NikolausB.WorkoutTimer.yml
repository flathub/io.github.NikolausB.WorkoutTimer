app-id: io.github.NikolausB.WorkoutTimer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: training
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Raw gamepad input (/dev/input/event*) for the Steam Deck / controller
  # support; falls back to device=all on Flatpaks without input-device support
  - --device-if=all:!has-input-device
  - --device=input
  - --share=ipc
  # AI coach: local Ollama and OpenAI-compatible endpoints
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/training/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: training
    buildsystem: meson
    config-opts:
      - --buildtype=release
    builddir: true
    sources:
      - type: git
        url: https://github.com/NikolausB/WorkoutTimer
        tag: v1.4.1
        commit: ff0cf4dfc108164374a8ec890d4150e018195883
      - cargo-sources.json
      # Cargo source replacement pointing at the vendor layout extracted
      # by cargo-sources.json (flathub-cargo-generator pattern), so the
      # build is fully offline - no crate index/network in the sandbox.
      - type: inline
        dest: .cargo
        dest-filename: config
        contents: |
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "cargo/vendor"
